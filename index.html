         background: #F7F1E5; color: #3B604D; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  p { font-size: 18px; }
</style>

<body>
<p id="msg">幸福分行搬家了，正在帶你過去…</p>
<script>
// 2026-09-29 網站搬到 Firebase Hosting（GitHub Pages 對台灣下載僅約 1 MB/s）。
// 舊網址只做轉址，並把這個瀏覽器裡的存檔帶過去：
// ① 從舊站 IndexedDB（Godot user:// = /userfs）讀出存檔；
// ② 雲端槽位是空的就先把存檔上傳（還沒用過雲端存檔的玩家也不會掉進度）；
// ③ 以 #migrate=<玩家代碼> 轉到新網址，新站本機沒有進度時採用此代碼並自動從雲端還原。
(function () {
  var NEW_URL = 'https://appleline-ab4fa.web.app/';
  var RTDB = 'https://appleline-ab4fa-default-rtdb.asia-southeast1.firebasedatabase.app';
  var DIR = '/userfs/godot/app_userdata/幸福分行 Happy Branch/';
  var FILES = { week: 'week_state.json', history: 'history.json', codex: 'codex.json', settings: 'settings.json' };
  var done = false;
  function go(key) {
    if (done) return;
    done = true;
    location.replace(NEW_URL + location.search + (key ? '#migrate=' + encodeURIComponent(key) : ''));
  }
  setTimeout(function () { go(null); }, 8000);  // 保險：任何一步卡住都照樣轉過去
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
  } catch (e) {}

  function readFiles() {
    return new Promise(function (resolve) {
      if (!window.indexedDB) return resolve({});
      var req = indexedDB.open('/userfs');
      req.onerror = function () { resolve({}); };
      req.onsuccess = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('FILE_DATA')) { db.close(); return resolve({}); }
        var store = db.transaction('FILE_DATA').objectStore('FILE_DATA');
        var out = {};
        var keys = Object.keys(FILES);
        var left = keys.length;
        keys.forEach(function (k) {
          var g = store.get(DIR + FILES[k]);
          g.onsuccess = function () {
            var entry = g.result;
            if (entry && entry.contents) {
              var c = entry.contents;
              out[k] = new TextDecoder('utf-8').decode(new Uint8Array(c.buffer, c.byteOffset, c.byteLength));
            }
            if (--left === 0) { db.close(); resolve(out); }
          };
          g.onerror = function () { if (--left === 0) { db.close(); resolve(out); } };
        });
      };
    });
  }

  function randomKey() {
    var a = new Uint8Array(8);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  readFiles().then(function (files) {
    if (!files.week) return go(null);  // 沒玩過：直接轉址
    var settings = {};
    try { settings = files.settings ? JSON.parse(files.settings) : {}; } catch (e) { settings = {}; }
    var key = String(settings.cloud_key || '');
    if (!/^[A-Za-z0-9_-]{4,64}$/.test(key)) {
      key = randomKey();
      settings.cloud_key = key;
    }
    files.settings = JSON.stringify(settings);
    var slot = RTDB + '/saves/' + encodeURIComponent(key) + '.json';
    return fetch(slot).then(function (r) { return r.text(); }).then(function (text) {
      if (text !== 'null') return;  // 雲端已有備份（每天打烊自動推送）→ 以雲端為準
      return fetch(slot, {
        method: 'PUT',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: JSON.stringify({ time: Date.now() / 1000, data: { files: files } })
      });
    }).then(function () { go(key); }, function () { go(key); });
  }).catch(function () { go(null); });
})();
</script>
</body>
</html>
